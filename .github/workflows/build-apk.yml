name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Create Android project structure
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/cyberrealm/idle
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cp index.html app/src/main/assets/
          cp manifest.json app/src/main/assets/
          cp sw.js app/src/main/assets/
          
      - name: Write Gradle files
        run: |
          cat > settings.gradle.kts << 'SETTINGS_EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = "CyberRealm"
include(":app")
SETTINGS_EOF

          cat > build.gradle.kts << 'BUILD_EOF'
plugins {
    id("com.android.application") version "8.7.3" apply false
}
BUILD_EOF

          cat > app/build.gradle.kts << 'APP_BUILD_EOF'
plugins {
    id("com.android.application")
}
android {
    namespace = "com.cyberrealm.idle"
    compileSdk = 34
    defaultConfig {
        applicationId = "com.cyberrealm.idle"
        minSdk = 21
        targetSdk = 34
        versionCode = 95
        versionName = "9.5"
    }
    buildTypes {
        getByName("release") {
            isMinifyEnabled = false
        }
    }
    lint {
        abortOnError = false
    }
}
dependencies {
    implementation("androidx.webkit:webkit:1.8.0")
}
APP_BUILD_EOF

      - name: Write Android manifest
        run: >-
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.cyberrealm.idle">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application android:label="Cyber Realm Idle"
                  android:theme="@android:Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST_EOF

      - name: Write MainActivity
        run: >-
          mkdir -p app/src/main/java/com/cyberrealm/idle && cat > app/src/main/java/com/cyberrealm/idle/MainActivity.java << 'JAVA_EOF'
          package com.cyberrealm.idle;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          public class MainActivity extends Activity {
              private WebView webView;
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  CookieManager.getInstance().setAcceptCookie(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
              @Override public boolean onKeyDown(int keyCode, android.view.KeyEvent event) {
                  if (keyCode == 4 && webView.canGoBack()) { webView.goBack(); return true; }
                  return super.onKeyDown(keyCode, event);
              }
          }
          JAVA_EOF

      - name: Write minimal resources
        run: |
          cat > app/src/main/res/values/strings.xml << 'STRINGS_EOF'
<resources>
<string name="app_name">Cyber Realm Idle</string>
</resources>
STRINGS_EOF

          cat > app/src/main/res/values/styles.xml << 'STYLES_EOF'
<resources>
<style name="AppTheme" parent="android:Theme.Material.NoActionBar">
<item name="android:statusBarColor">#050510</item>
</style>
</resources>
STYLES_EOF

          cat > app/src/main/res/layout/activity_main.xml << 'LAYOUT_EOF'
<FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
android:layout_width="match_parent"
android:layout_height="match_parent">
</FrameLayout>
LAYOUT_EOF

      - name: Build debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberRealm-v9.5-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
