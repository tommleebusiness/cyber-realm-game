<script>
"use strict";
var curUser=null,users={};
try{users=JSON.parse(localStorage.getItem("cr_users")||"{}")}catch(e){}
function saveUsers(){localStorage.setItem("cr_users",JSON.stringify(users))}
function hv(p){var h=0;for(var i=0;i<p.length;i++){h=((h<<5)-h)+p.charCodeAt(i);h|=0}return h.toString(36)}
function id(s){return document.getElementById(s)}
function ga(e,a){return e?e.getAttribute(a):null}
function hasClass(e,c){return e&&e.className&&e.className.indexOf(c)>=0}
function addClass(e,c){if(e&&!hasClass(e,c))e.className=e.className+" "+c}
function remClass(e,c){if(e)e.className=e.className.replace(new RegExp("\\b"+c+"\\b","g"),"").replace(/\s+/g," ").trim()}
function fmt(n){if(n>=1e15)return(n/1e15).toFixed(1)+"Q";if(n>=1e12)return(n/1e12).toFixed(1)+"T";if(n>=1e9)return(n/1e9).toFixed(1)+"B";if(n>=1e6)return(n/1e6).toFixed(1)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"K";return Math.floor(n)}
function dlg(t,p,bs){id("ovt").textContent=t;id("ovp").textContent=p;id("ovb").innerHTML="";for(var i=0;i<bs.length;i++){var b=document.createElement("button");b.textContent=bs[i].t;b.onclick=bs[i].f;id("ovb").appendChild(b)}id("ov").style.display="flex"}
function hdlg(){id("ov").style.display="none"}
var VER="11.0";
var S={c:0,ct:0,g:0,cl:0,bs:0,pr:0,pp:0,cp:1,ps:0,gm:1,luck:1,rl:1,rp:0,rg:100,up:{},ac:[],craft:[],cb:null,bh:0,lastDaily:0,dailyStreak:0,combo:0,comboMax:0,lastTapTime:0,activeEvent:null,eventTimer:0,skillCrit:0,skillDouble:0,skillShield:0,pets:[],activePet:null,dailyQ:[],dailyP:[],dailyDay:0,secrets:[]};

var BOSS_INTERVAL=200;
function getCPS(){return Math.floor(S.ps*S.gm)}
function initGame(){S={c:0,ct:0,g:0,cl:0,bs:0,pr:0,pp:0,cp:1,ps:0,gm:1,luck:1,rl:1,rp:0,rg:100,up:{},ac:[],craft:[],cb:null,bh:0,lastDaily:0,dailyStreak:0,combo:0,comboMax:0,lastTapTime:0,activeEvent:null,eventTimer:0,skillCrit:0,skillDouble:0,skillShield:0,pets:[],activePet:null,dailyQ:[],dailyP:[],dailyDay:0,secrets:[]};tapSinceBoss=0;genDaily()}

function tap(){
  var now=Date.now();
  if(now-S.lastTapTime<500){S.combo++;if(S.combo>S.comboMax)S.comboMax=S.combo}else{S.combo=1};
  S.lastTapTime=now;
  var dbl=1;if(S.skillDouble>0&&Math.random()<(10+S.skillDouble*2)/100)dbl=1.5+S.skillDouble*0.2;
  var cb=1+Math.floor(S.combo/5)*0.5;
  var pm=S.activePet===1?1.1:1;
  var v=Math.floor(S.cp*S.gm*cb*S.luck*dbl*pm);
  S.c+=v;S.ct+=v;S.cl++;S.rp+=v;
  if(S.combo>=5){var cd=id("combo-display");cd.textContent="⚡ COMBO x"+S.combo+"!";cd.className="show";setTimeout(function(){cd.className=""},1500)}
  id("tpinfo").textContent="+"+fmt(v)+(S.combo>1?" x"+cb.toFixed(1)+" ⚡":"");
  id("tpinfo").className=cb>1?"bonus":"";
  var btn=id("tpbtn");btn.className="pressing";setTimeout(function(){btn.className=""},150);
  if(S.cb&&S.bh>0){var dmg=v;if(S.skillCrit>0&&Math.random()<(10+S.skillCrit*3)/100)dmg=Math.floor(dmg*(2+S.skillCrit*0.5));var blocked=false;if(S.skillShield>0&&Math.random()<(5+S.skillShield*2)/100)blocked=true;S.bh-=dmg;updateBossHP();if(S.bh<=0)winBoss();else if(!blocked){var bd=Math.max(1,Math.floor(S.cb.hp*0.001));S.c=Math.max(0,S.c-bd)}}
  var lv=0;while(S.rp>=S.rg){S.rp-=S.rg;S.rl++;S.rg=Math.floor(S.rg*1.4);S.cp+=Math.ceil(S.rl*0.5);S.ps+=S.rl*0.3;lv++}
  if(lv>0){var n=document.createElement("div");n.style.cssText="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,255,255,.2);border:1px solid #0ff;border-radius:8px;padding:8px 16px;font-size:14px;color:#0ff;z-index:1000;pointer-events:none";n.innerHTML='РЕЙМ ПОВЫШЕН! Ур.'+S.rl;document.body.appendChild(n);setTimeout(function(){if(n.parentNode)n.parentNode.removeChild(n)},2000)}
  tapSinceBoss++;
  if(!S.cb&&tapSinceBoss>=BOSS_INTERVAL){spawnBoss();tapSinceBoss=0}
  updateDQ("tap",1);if(S.combo>=5)updateDQ("combo",1);
  checkPets();chkAch();chkQuests();draw();
}
function spawnBoss(){if(S.cb)return;var pi=Math.min(Math.floor(S.rl/3),BS.normal.length-1);var rare=Math.random()<0.05+S.luck*0.02;var boss=rare&&BS.rare.length>0?BS.rare[Math.floor(Math.random()*BS.rare.length)]:BS.normal[pi];var hp=getBossHP(boss.hp);S.cb={n:boss.n,hp:hp,cr:Math.floor(boss.cr*(1+S.pr*0.2)*(S.activePet===4?1.2:1)),ic:boss.ic,rare:rare,maxHP:hp};S.bh=hp;showBossFight()}

function winBoss(){var r=Math.floor(S.cb.cr*S.gm*(1+S.pr*0.2)*(S.activePet===4?1.2:1));S.c+=r;S.bs++;flyText("+ "+fmt(r));S.cb=null;S.bh=0;id("bfight").style.display="none";updateDQ("boss",1);if(S.comboMax>=100&&S.secrets.indexOf("combo_king")<0){S.secrets.push("combo_king");S.g+=50;setTimeout(function(){dlg("🔓 Секрет!","Комбо-Король! +50💎",[{t:"OK",f:function(){hdlg()}}])},500)}if(id("panel").style.display==="flex"&&id("panT").textContent.indexOf("Боссы")>=0)showPanel("bo");chkAch();draw();saveGame()}

function attackBoss(){var dmg=Math.floor(S.cp*S.gm);if(S.skillCrit>0&&Math.random()<(10+S.skillCrit*3)/100)dmg=Math.floor(dmg*(2+S.skillCrit*0.5));var blocked=false;if(S.skillShield>0&&Math.random()<(5+S.skillShield*2)/100)blocked=true;S.bh-=dmg;S.rp+=dmg;var d=document.createElement("div");d.className="fdmg";d.textContent="-"+fmt(dmg);d.style.left=(30+Math.random()*40)+"%";d.style.top="30%";id("bfight").appendChild(d);setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},800);if(S.bh<=0)winBoss();else{if(!blocked){var bd=Math.max(1,Math.floor(S.cb.maxHP*0.002));S.c=Math.max(0,S.c-bd)}updateBossHP()}while(S.rp>=S.rg){S.rp-=S.rg;S.rl++;S.rg=Math.floor(S.rg*1.4);S.cp+=Math.ceil(S.rl*0.5);S.ps+=S.rl*0.3}draw();saveGame()}

function doPrestige(){if(S.rl<10)return dlg("🌟 Престиж","Нужен Рейм 10+!",[{t:"OK"}]);var pts=Math.floor(Math.sqrt(Math.sqrt(Math.max(0,S.ct))/1e3)+S.rl*0.3);if(pts<1)pts=1;var oldPr=S.pr;var keepG=S.g,keepCraft=S.craft.slice(),keepCombo=S.comboMax,keepPets=S.pets.slice(),keepPet=S.activePet,keepSecrets=S.secrets.slice();S.pr++;S.pp+=pts;S.c=0;S.ct=0;S.cl=0;S.cp=1+S.pp*0.08;S.ps=0;S.gm=1+S.pp*0.05;S.luck=1;S.rl=1;S.rp=0;S.rg=100;S.up={};S.cb=null;S.bh=0;S.ac=[];tapSinceBoss=0;S.g=keepG;S.craft=keepCraft;S.comboMax=keepCombo;S.pets=keepPets;S.activePet=keepPet;S.secrets=keepSecrets;var ms=[{pr:1,bonus:"+8% тап"},{pr:5,bonus:"+20% босс-награды"},{pr:10,bonus:"x2 гемы"},{pr:25,bonus:"x5 всё"}];var unlocked=[];for(var i=0;i<ms.length;i++){if(S.pr>=ms[i].pr&&oldPr<ms[i].pr)unlocked.push(ms[i].bonus)}var msg="Престиж "+S.pr+"! Очки: "+pts;if(unlocked.length>0)msg+="\n\n🏆 Новое:\n"+unlocked.join("\n");hdlg();id("panel").style.display="none";setTimeout(function(){dlg("🌟 Престиж "+S.pr,msg,[{t:"OK",f:function(){hdlg()}}])},300);saveGame();draw()}

function genDaily(){var day=Math.floor(Date.now()/86400000);S.dailyDay=day;S.dailyQ=[];S.dailyP=[];var types=["tap","boss","upgrade","combo"];var used={};for(var i=0;i<3;i++){var ti;do{ti=Math.floor(Math.random()*types.length)}while(used[ti]&&Object.keys(used).length<types.length);used[ti]=true;var tgt,rw;if(types[ti]==="tap"){tgt=50+Math.floor(day%20)*10;rw=5+Math.floor(day%10)}else if(types[ti]==="boss"){tgt=1+Math.floor(day%5);rw=10+Math.floor(day%10)*2}else if(types[ti]==="upgrade"){tgt=2+Math.floor(day%3);rw=8+Math.floor(day%5)}else{tgt=5+Math.floor(day%5);rw=5+Math.floor(day%5)}var nm=types[ti]==="tap"?"Тапни "+tgt+" раз":types[ti]==="boss"?"Убей "+tgt+" босса":types[ti]==="upgrade"?"Купи "+tgt+" улучш.":"Комбо x"+tgt;S.dailyQ.push({type:types[ti],name:nm,target:tgt,reward:rw});S.dailyP.push(0)}}
function updateDQ(type,amount){for(var i=0;i<S.dailyQ.length;i++){if(S.dailyQ[i].type===type){S.dailyP[i]=Math.min(S.dailyQ[i].target,(S.dailyP[i]||0)+amount);if(S.dailyP[i]>=S.dailyQ[i].target&&!S.dailyQ[i].done){S.dailyQ[i].done=true;S.g+=S.dailyQ[i].reward;dlg("🎯 Задание!",S.dailyQ[i].name+"\n+"+S.dailyQ[i].reward+"💎",[{t:"OK",f:function(){hdlg()}}])}}}}

    if(S.cb){var pct=Math.max(0,(S.bh/S.cb.maxHP)*100);p.innerHTML='<div class="boss"><div class="bn">'+S.cb.ic+" "+S.cb.n+(S.cb.rare?' ⭐':'')+'</div><div class="hp"><div class="hp-f" style="width:'+pct+'%"></div></div><div class="st"><span>HP: '+fmt(S.bh)+' / '+fmt(S.cb.maxHP)+'</span></div><div class="rw">Награда: '+fmt(S.cb.cr)+'💎</div></div><button class="atk-btn" id="pb">⚔️ АТАКОВАТЬ</button>';id("pb").onclick=attackBoss}
    else{var rem=BOSS_INTERVAL-tapSinceBoss;p.innerHTML='<div style="text-align:center;padding:15px"><div style="font-size:40px">👹</div><div style="color:#ffd700;font-size:24px;font-weight:bold">'+rem+' тапов</div><div style="color:#666;font-size:10px">Каждые 200 тапов</div>';if(S.rl>=5){p.innerHTML+='<button class="atk-btn" id="sb" style="margin-top:10px">⚔️ Призвать</button>';id("sb").onclick=function(){spawnBoss();id("panel").style.display="none";saveGame()}}}
  }else if(t==="ac"){
    id("panT").textContent="🏆 Достижения ("+S.ac.length+"/"+ACHS.length+")";
    for(var i=0;i<ACHS.length;i++){var a=ACHS[i],done=S.ac.indexOf(a.id)>=0;p.innerHTML+='<div class="ach'+(done?' done':'')+'"><span class="ic">'+(done?'✅':'🔲')+'</span><div class="inf"><div class="an">'+a.n+'</div></div><span class="ar">'+(done?'Готово':'💎10')+'</span></div>'}
    p.innerHTML+='<div style="margin-top:10px;color:#ffd700;font-size:11px;font-weight:bold">🔮 Секреты ('+S.secrets.length+'/'+SECRETS.length+')</div>';
    for(var i=0;i<SECRETS.length;i++){var s=SECRETS[i],found=S.secrets.indexOf(s.id)>=0;p.innerHTML+='<div class="ach'+(found?' done':'')+'"><span class="ic">'+(found?'🔓':'❓')+'</span><div class="inf"><div class="an">'+(found?s.n:'???')+'</div><div style="color:#666;font-size:9px">'+(found?'Найдено!':s.h)+'</div></div></div>'}
  }else if(t==="qu"){
    id("panT").textContent="🎯 Квесты ("+completedQuests.length+"/"+QUESTS.length+")";
    for(var i=0;i<QUESTS.length;i++){var q=QUESTS[i],done=completedQuests.indexOf(q.id)>=0;p.innerHTML+='<div class="ach'+(done?' done':'')+'"><span class="ic">'+(done?'✅':'🎯')+'</span><div class="inf"><div class="an">'+q.n+'</div><div style="color:#777;font-size:9px">'+q.d+'</div></div><span class="ar">'+(done?'Готово':'+'+fmt(q.r.c)+'💎')+'</span></div>'}
  }else if(t==="cf"){
    id("panT").textContent="🔧 Крафт";
    for(var i=0;i<CRAFT.length;i++){var c=CRAFT[i],owned=S.craft.indexOf(c.id)>=0,can=!owned&&S.c>=c.cost.c&&S.g>=c.cost.g;p.innerHTML+='<div class="card'+(can?' can':'')+(owned?' done':'')+'" data-ci="'+i+'"><div class="h"><span class="nm">'+c.n+'</span><span class="lv">'+c.cost.g+'💎</span></div><div class="d">'+c.d+'</div><div class="c">'+(owned?'СДЕЛАНО ✓':(can?fmt(c.cost.c)+'💎':'Нужно: '+fmt(c.cost.c)+'💎'))+'</div></div>'}
    var cc=p.querySelectorAll(".card");for(var i=0;i<cc.length;i++){cc[i].onclick=function(){var idx=parseInt(ga(this,"data-ci")),r=CRAFT[idx];if(S.craft.indexOf(r.id)>=0)return;if(S.c<r.cost.c||S.g<r.cost.g)return;S.c-=r.cost.c;S.g-=r.cost.g;S.craft.push(r.id);r.fn();chkAch();showPanel("cf");saveGame();draw()}}
  }else if(t==="tsk"){
    id("panT").textContent="⚡ Скиллы (💎"+S.g+")";
    var sLv=[S.skillCrit,S.skillDouble,S.skillShield];
    for(var i=0;i<SKILLS.length;i++){var s=SKILLS[i],lv=sLv[i],cost=Math.floor(s.bc*Math.pow(s.cm,lv)),can=lv<s.ml&&S.g>=cost;p.innerHTML+='<div class="card'+(can?' can':'')+(lv>=s.ml?' done':'')+'" data-si="'+i+'"><div class="h"><span class="nm">'+s.n+'</span><span class="lv">Ур.'+lv+'/'+s.ml+'</span></div><div class="d">'+s.desc(lv)+'</div><div class="c">'+(lv>=s.ml?'МАКС ✓':cost+'💎')+'</div></div>'}
    var sc=p.querySelectorAll(".card");for(var i=0;i<sc.length;i++){sc[i].onclick=function(){var si=parseInt(ga(this,"data-si")),s=SKILLS[si],lv=si===0?S.skillCrit:si===1?S.skillDouble:S.skillShield,cost=Math.floor(s.bc*Math.pow(s.cm,lv));if(lv>=s.ml||S.g<cost)return;S.g-=cost;if(si===0)S.skillCrit++;else if(si===1)S.skillDouble++;else S.skillShield++;showPanel("tsk");saveGame();draw()}}
  }else if(t==="tpt"){
    id("panT").textContent="🐾 Питомцы";
    for(var i=0;i<PETS.length;i++){var pet=PETS[i],unlocked=S.pets.indexOf(pet.id)>=0,active=S.activePet===pet.id;p.innerHTML+='<div class="card'+(unlocked?' can':'')+(active?' done':'')+'" data-pi="'+pet.id+'"><div class="h"><span class="nm">'+pet.n+'</span><span class="lv">'+(active?'АКТИВЕН':(unlocked?'Неактивен':'🔒'))+'</span></div><div class="d">'+(unlocked?pet.d:'🔒')+'</div></div>'}
    var pc=p.querySelectorAll(".card");for(var i=0;i<pc.length;i++){pc[i].onclick=function(){var pi=parseInt(ga(this,"data-pi"));if(S.pets.indexOf(pi)<0)return;S.activePet=(S.activePet===pi)?null:pi;showPanel("tpt");saveGame();draw()}}
  }else if(t==="ts"){
    id("panT").textContent="📅 Ежедневные";
    for(var i=0;i<S.dailyQ.length;i++){var dq=S.dailyQ[i],prog=S.dailyP[i]||0,done=prog>=dq.target;p.innerHTML+='<div class="ach'+(done?' done':'')+'"><span class="ic">'+(done?'✅':'🎯')+'</span><div class="inf"><div class="an">'+dq.name+'</div><div style="color:#777;font-size:9px">'+prog+'/'+dq.target+'</div></div><span class="ar">'+dq.reward+'💎</span></div>'}
  }else if(t==="st"){
    id("panT").textContent="📊 Статистика";
    var rows=[["Игрок",curUser||"?"],["Кредиты",fmt(S.c)],["Всего",fmt(S.ct)],["Гемы",S.g],["Рейм",S.rl],["Престиж",S.pr],["Боссы",S.bs],["Тап/сек",fmt(getCPS())],["Удача",Math.round((S.luck-1)*100)+"%"],["Комбо макс",S.comboMax],["Крафт",S.craft.length]];
    for(var i=0;i<rows.length;i++)p.innerHTML+='<div class="strow"><span class="sl">'+rows[i][0]+'</span><span class="sv">'+rows[i][1]+'</span></div>';
    p.innerHTML+='<button class="btn" id="prBtn" style="margin-top:10px;background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000"'+(S.rl<10?' disabled':'')+'>🌟 Престиж'+(S.rl<10?' (Рейм 10+)':'')+'</button>';
    p.innerHTML+='<button class="danger" id="delBtn">🗑️ Удаление</button>';
    id("prBtn").onclick=function(){if(S.rl<10)return;dlg("🌟 Престиж","Рейм 10+ ✓\nСброс: кредиты, тапы, улучшения\nСохраняет: гемы, крафт, питомцы, секреты",[{t:"Отмена",f:function(){hdlg()}},{t:"Да!",f:function(){doPrestige()}}])};
    id("delBtn").onclick=function(){dlg("Удалить ВСЁ?","Нельзя отменить!",[{t:"Отмена",f:function(){hdlg()}},{t:"УДАЛИТЬ",f:function(){localStorage.clear();location.reload()}}])}
  }else if(t==="lb"){
    id("panT").textContent="🏅 Рейтинг";
    p.innerHTML='<div class="lb-refresh" id="lbr">🔄 Обновить</div>';
    var lb=[];try{var d=localStorage.getItem("cr_lb11");if(d)lb=JSON.parse(d)}catch(e){}
    var me={name:curUser||"?",credits:S.ct,level:S.rl,bosses:S.bs,prestige:S.pr};
    var f=false;for(var i=0;i<lb.length;i++){if(lb[i].name===curUser){lb[i]=me;f=true;break}}
    if(!f)lb.push(me);lb.sort(function(a,b){return b.credits-a.credits});lb=lb.slice(0,50);
    try{localStorage.setItem("cr_lb11",JSON.stringify(lb))}catch(e){}
    if(!lb.length){p.innerHTML+='<div class="lb-empty">Будь первым! 🚀</div>'}else{for(var i=0;i<Math.min(lb.length,20);i++){var r=lb[i],isMe=r.name===curUser;p.innerHTML+='<div class="lb-row'+(isMe?' me':'')+'"><span class="lb-rank">'+(i+1)+'</span><span class="lb-name">'+r.name+(isMe?' (ты)':'')+'</span><span class="lb-val">'+fmt(r.credits)+'💎</span></div>'}}
    id("lbr").onclick=function(){showPanel("lb")}
  }else if(t==="dt"){
    id("panT").textContent="💎 Поддержка";
    var addr="0xC3a92F52E39aaa4B86011d877b40B80Dc39313Ff";
    p.innerHTML='<div style="text-align:center;padding:15px"><div style="font-size:40px">💎</div><div style="color:#ffd700;font-size:14px;font-weight:bold">Крипто-донат</div><div style="background:rgba(0,0,0,.3);border-radius:8px;padding:8px;margin:8px 0;color:#0ff;font-size:10px;word-break:break-all;cursor:pointer" id="da">'+addr+'</div><button class="btn" id="cb" style="background:linear-gradient(135deg,#0ff,#4af);color:#000">📋 Копировать</button></div>';
    var cp=function(){navigator.clipboard.writeText(addr);dlg("✅ Скопировано!","",[{t:"OK",f:function(){hdlg()}}])};
    id("da").onclick=cp;id("cb").onclick=cp;
  }
}
function showScreen(s){
  id("login-scr").style.display="none";id("game-scr").style.display="none";
  id("chat-scr").style.display="none";id("panel").style.display="none";id("bfight").style.display="none";
  if(s==="login")id("login-scr").style.display="flex";
  else if(s==="game")id("game-scr").style.display="flex";
  else if(s==="chat"){id("game-scr").style.display="flex";id("chat-scr").style.display="flex";renderChat()}
  else if(["up","bo","ac","qu","cf","tsk","tpt","ts","st","dt","lb"].indexOf(s)>=0){id("game-scr").style.display="flex";showPanel(s)}
}
id("tgame").onclick=function(){id("panel").style.display="none"};
id("tup").onclick=function(){showScreen("up")};
id("tbo").onclick=function(){showScreen("bo")};
id("tac").onclick=function(){showScreen("ac")};
id("tqu").onclick=function(){showScreen("qu")};
id("tcf").onclick=function(){showScreen("cf")};
id("tsk").onclick=function(){showScreen("tsk")};
id("tpt").onclick=function(){showScreen("tpt")};
id("ts").onclick=function(){showScreen("ts")};
id("tst").onclick=function(){showScreen("st")};
id("tdt").onclick=function(){showScreen("dt")};
id("tlb").onclick=function(){showScreen("lb")};
id("tch").onclick=function(){showScreen("chat")};
id("alogin").onclick=function(){var u=id("au").value.trim(),p=id("ap").value;if(!u||!p){amsg("Заполни поля","err");return}if(!users[u]){amsg("Не найден","err");return}if(users[u].pass!==hv(p)){amsg("Неверный пароль","err");return}curUser=u;users[u].lastLogin=Date.now();saveUsers();loadGame();checkDailyReward();showScreen("game");amsg("")};
id("areg").onclick=function(){var u=id("au").value.trim(),p=id("ap").value;if(!u||!p){amsg("Заполни поля","err");return}if(u.length<3){amsg("Мин. 3 символа","err");return}if(p.length<4){amsg("Мин. 4 символа","err");return}if(users[u]){amsg("Имя занято","err");return}users[u]={pass:hv(p),created:Date.now(),lastLogin:Date.now()};saveUsers();curUser=u;initGame();showScreen("game");amsg("Создано!","ok")};
id("lout").onclick=function(){saveGame();curUser=null;showScreen("login")};
id("cChat").onclick=function(){showScreen("game")};
id("pcan").onclick=function(){id("panel").style.display="none"};
function checkDailyReward(){var now=Math.floor(Date.now()/86400000),last=S.lastDaily||0,streak=S.dailyStreak||0;if(now>last){if(now===last+1)streak++;else streak=1;S.lastDaily=now;S.dailyStreak=streak;var rw=[{c:100,g:5},{c:250,g:10},{c:500,g:20},{c:1000,g:35},{c:2000,g:50},{c:5000,g:75},{c:10000,g:100}];var r=rw[Math.min(streak-1,rw.length-1)];S.c+=r.c;S.g+=r.g;S.ct+=r.c;setTimeout(function(){dlg("🎁 Награда!","День "+streak+"\n+"+fmt(r.c)+"💎 +"+r.g+"💎",[{t:"OK",f:function(){hdlg()}}])},500)}}
var chatTab="g",chatMsgs=[];
try{chatMsgs=JSON.parse(localStorage.getItem("cr11_chat")||"[]")}catch(e){}
function saveChat(){localStorage.setItem("cr11_chat",JSON.stringify(chatMsgs.slice(-200)))}
function addChatMsg(a,t){chatMsgs.push({a:a,t:t,ts:Date.now()});saveChat();renderChat()}
function renderChat(){var e=id("chmsgs");e.innerHTML="";var msgs=chatTab==="g"?chatMsgs:chatMsgs.filter(function(m){return m.a==="🦉 OWL"||m.a===curUser});for(var i=0;i<msgs.length;i++){var m=msgs[i],cls="chmsg"+(m.a===curUser?" me":"")+(m.a==="🦉 OWL"?" owl":"");e.innerHTML+='<div class="'+cls+'"><div class="auth">'+m.a+'</div><div class="txt">'+m.t+'</div></div>'}if(!msgs.length)e.innerHTML='<div style="text-align:center;color:#555;padding:20px">Пусто</div>';e.scrollTop=e.scrollHeight}
function owlRespond(text){var L=text.toLowerCase(),r="";if(L.indexOf("привет")>=0)r="Привет! 👋 OWL 🦉\n\nКоманды: Добавь босса, Дай кредитов/гемов, Повысь уровень, Исправь баги, Что нового?, Статус, Шутка, Помощь";else if(L.indexOf("босс")>=0){spawnBoss();r="✅ Босс призван! 👹"}else if(L.indexOf("кредит")>=0){var a=500+Math.floor(Math.random()*2000);S.c+=a;S.ct+=a;r="💰 +"+fmt(a)+"💎"}else if(L.indexOf("уровень")>=0){var lv=1+Math.floor(Math.random()*3);S.rl+=lv;r="🌀 +"+lv+" рейм! Ур.: "+S.rl}else if(L.indexOf("гем")>=0){var g=10+Math.floor(Math.random()*40);S.g+=g;r="💎 +"+g+" гемов!"}else if(L.indexOf("баг")>=0){S.c+=1000;S.g+=50;S.cp+=3;r="🐛 Исправлено! +1000💎 +50💎 +3тап"}else if(L.indexOf("что нов")>=0)r="🆕 v11!\n👹 Боссы каждые 200 тапов\n🌟 Престиж с Рейм 10+\n⚡ Скиллы за гемы\n🐾 4 питомца\n📅 Ежедневные задания\n🔮 5 секретов\n💤 Оффлайн-прогресс";else if(L.indexOf("статус")>=0)r="📊\n👤 "+curUser+"\n💎 "+fmt(S.c)+" | 🌀 "+S.rl+" | ⭐ "+S.pr+"\n⚡ "+fmt(getCPS())+"/с | 👹 "+S.bs;else if(L.indexOf("шутка")>=0){S.c+=50;S.g+=5;r="😄 Шутка...\nПочему программисты путают Хэллоуин и Рождество?\nOct 31 = Dec 25!\n\n+50💎 +5💎"}else if(L.indexOf("помощь")>=0)r="📋 Команды:\n• Дай кредитов\n• Дай гемов\n• Повысь уровень\n• Добавь босса\n• Исправь баги\n• Статус\n• Что нового?\n• Шутка";else{r="✅ OK! +200💎 +10💎";S.c+=200;S.g+=10}if(L.indexOf("42")>=0&&S.secrets.indexOf("owl_master")<0){S.secrets.push("owl_master");r+="\n🔓 Секрет!";S.g+=100}if(S.ct>=1e12&&S.secrets.indexOf("trillionaire")<0){S.secrets.push("trillionaire");r+="\n🔓 Триллионер!";S.g+=200}draw();addChatMsg("🦉 OWL",r)}
id("chat-send").onclick=function(){var text=id("chat-in").value.trim();if(!text)return;id("chat-in").value="";addChatMsg(curUser||"Гость",text);if(chatTab==="o"){id("chowli").style.display="block";setTimeout(function(){id("chowli").style.display="none";owlRespond(text)},600+Math.random()*800)}};
id("chat-in").addEventListener("keydown",function(e){if(e.key==="Enter")id("chat-send").click()});
id("chtabs").addEventListener("click",function(e){var t=e.target.closest(".chtab");if(!t)return;var all=document.querySelectorAll(".chtab");for(var i=0;i<all.length;i++)remClass(all[i],"on");addClass(t,"on");chatTab=t.getAttribute("data-ct");renderChat()});
window.addEventListener("beforeunload",function(){saveGame()});
setInterval(function(){saveGame()},30000);
setInterval(function(){if(getCPS()>0){var inc=Math.floor(getCPS()*0.3);S.c+=inc;S.ct+=inc;S.rp+=inc}while(S.rp>=S.rg){S.rp-=S.rg;S.rl++;S.rg=Math.floor(S.rg*1.4);S.cp+=Math.ceil(S.rl*0.5);S.ps+=S.rl*0.3}tickEvents();draw()},1000);
setInterval(function(){if(S.combo>0&&Date.now()-S.lastTapTime>2000)S.combo=0;draw()},2000);
setInterval(function(){localStorage.setItem("cr_t",Date.now().toString())},10000);
function calcOffline(){if(!curUser)return;var last=parseInt(localStorage.getItem("cr_t")||"0");var elapsed=Math.min(Date.now()-last,3600000);if(elapsed<5000)return;var cps=getCPS();if(cps<1)return;var gained=Math.floor(cps*elapsed/1000*0.5);if(gained<1)return;S.c+=gained;S.ct+=gained;S.rp+=gained;setTimeout(function(){dlg("💤 Оффлайн!","+"+fmt(gained)+"💎",[{t:"OK",f:function(){hdlg()}}])},1000);while(S.rp>=S.rg){S.rp-=S.rg;S.rl++;S.rg=Math.floor(S.rg*1.4);S.cp+=Math.ceil(S.rl*0.5);S.ps+=S.rl*0.3}draw()}
function initBg(){var c=id("bg-parts"),colors=["#0ff","#f0f","#0f0","#ffd700","#f44"];for(var i=0;i<15;i++){var p=document.createElement("div");p.className="bg-p";var s=2+Math.random()*4;p.style.cssText="width:"+s+"px;height:"+s+"px;background:"+colors[Math.floor(Math.random()*colors.length)]+";left:"+(Math.random()*100)+"%;animation-duration:"+(8+Math.random()*12)+"s;animation-delay:"+(Math.random()*10)+"s";c.appendChild(p)}}
initBg();
document.getElementById("version-text").textContent="Cyber Realm Idle v"+VER;
var lv=localStorage.getItem("cr11_lv")||"0";if(lv!==VER){localStorage.setItem("cr11_lv",VER);setTimeout(function(){addChatMsg("🦉 OWL","🆕 v"+VER+"!\nБоссы каждые 200 тапов\nПрестиж, скиллы, питомцы\nНапиши 'что нового?'!")},2000)}
var lastUser=localStorage.getItem("cr_last");if(lastUser&&users[lastUser]){curUser=lastUser;loadGame();calcOffline();checkDailyReward()}else{showScreen("login")}
draw();
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").then(function(){}).catch(function(){});}
