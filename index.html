<!DOCTYPE html>
<html lang="ru">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050510">
<meta name="apple-mobile-web-app-title" content="Cyber Realm">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Футуристическая Idle Игра — тапай, улучшай, побеждай боссов!">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>Cyber Realm Idle v9</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
body{background:#050510;color:#0ff;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}

/* === ANIMATED BACKGROUND === */
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:
  radial-gradient(ellipse at 20% 50%,rgba(0,255,255,.04) 0%,transparent 50%),
  radial-gradient(ellipse at 80% 20%,rgba(170,0,255,.03) 0%,transparent 50%),
  radial-gradient(ellipse at 50% 80%,rgba(0,255,100,.02) 0%,transparent 50%);
  animation:bgShift 20s ease-in-out infinite alternate;pointer-events:none;z-index:0}
@keyframes bgShift{0%{opacity:.5;transform:scale(1)}100%{opacity:1;transform:scale(1.1)}}

/* === FLOATING PARTICLES === */
#bg-parts{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:hidden}
.bg-p{position:absolute;border-radius:50%;animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{opacity:0;transform:translateY(100vh) scale(0)}10%{opacity:.6}90%{opacity:.6}100%{opacity:0;transform:translateY(-10vh) scale(1)}}

/* === LOGIN SCREEN === */
#login-scr{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:20px;background:radial-gradient(ellipse at 50% 30%,rgba(0,255,255,.08),transparent 70%);position:relative;z-index:2}
#login-scr h1{font-size:2em;letter-spacing:4px;text-shadow:0 0 20px #0ff,0 0 40px rgba(0,255,255,.3);margin-bottom:8px;animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{0%{text-shadow:0 0 20px #0ff,0 0 40px rgba(0,255,255,.3)}100%{text-shadow:0 0 30px #0ff,0 0 60px rgba(0,255,255,.5),0 0 80px rgba(0,255,255,.2)}}
#login-scr .sub{color:#0f0;font-size:.9em;margin-bottom:20px;animation:fadeIn 1s ease-out}
@keyframes fadeIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
.fld{width:100%;max-width:320px}
.fld input{width:100%;padding:14px;margin-bottom:10px;background:rgba(0,255,255,.05);border:1px solid rgba(0,255,255,.2);border-radius:8px;color:#0ff;font-size:16px;outline:none;transition:all .3s}
.fld input:focus{border-color:#0ff;box-shadow:0 0 12px rgba(0,255,255,.2),inset 0 0 8px rgba(0,255,255,.05);transform:scale(1.02)}
.fld input::placeholder{color:rgba(0,255,255,.3)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#0ff,#4af);border:none;border-radius:8px;color:#000;font-size:16px;font-weight:bold;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,.1) 50%,transparent 60%);animation:shimmer 3s infinite}
@keyframes shimmer{0%{transform:translateX(-100%) rotate(45deg)}100%{transform:translateX(100%) rotate(45deg)}}
.btn:active{transform:scale(.96);box-shadow:0 0 20px rgba(0,255,255,.4)}
.btn2{width:100%;padding:14px;background:transparent;border:1px solid rgba(0,255,255,.3);color:#0ff;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:4px;transition:all .2s}
.btn2:active{transform:scale(.96);background:rgba(0,255,255,.1)}
.msg{text-align:center;font-size:12px;margin-top:10px;min-height:16px;transition:all .3s}
.msg.ok{color:#0f0;text-shadow:0 0 8px #0f0}
.msg.err{color:#f44;text-shadow:0 0 8px #f44;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* === GAME SCREEN === */
#game-scr{display:none;flex-direction:column;height:100%;position:relative;z-index:2}
header{background:linear-gradient(180deg,#0a1628,#0d1025);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid rgba(0,255,255,.25);flex-shrink:0;position:relative}
header::after{content:'';position:absolute;bottom:-2px;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,#0ff,transparent);animation:headerGlow 3s ease-in-out infinite}
@keyframes headerGlow{0%,100%{opacity:.5}50%{opacity:1}}
header h1{font-size:14px;letter-spacing:3px;text-shadow:0 0 8px #0ff}
.uinfo{display:flex;align-items:center;gap:8px;font-size:11px}
.uinfo .nm{color:#ffd700;text-shadow:0 0 6px rgba(255,215,0,.5)}
.lout{background:none;border:1px solid rgba(255,0,68,.3);color:#f44;padding:3px 8px;border-radius:3px;font-size:10px;cursor:pointer;transition:all .2s}
.lout:active{background:rgba(255,0,68,.2);transform:scale(.95)}

/* === RESOURCES BAR === */
.res{display:flex;justify-content:space-around;padding:6px;background:#0d1025;border-bottom:1px solid rgba(0,255,255,.1);flex-shrink:0;font-size:12px;position:relative}
.res::after{content:'';position:absolute;bottom:0;left:10%;width:80%;height:1px;background:linear-gradient(90deg,transparent,rgba(0,255,255,.2),transparent)}
.r{display:flex;align-items:center;gap:3px;transition:all .3s}
.r:hover{transform:scale(1.05)}
.v{color:#ffd700;font-weight:bold;text-shadow:0 0 4px rgba(255,215,0,.3);transition:all .3s}
.v.pop{animation:popNum .3s ease-out}
@keyframes popNum{0%{transform:scale(1.3);color:#fff}100%{transform:scale(1);color:#ffd700}}

/* === GAME AREA === */
#area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;position:relative}
#tapz{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;min-height:0}

/* === PARTICLES === */
#parts{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:10}
.pt{position:absolute;font-size:14px;font-weight:bold;animation:fly .8s ease-out forwards;pointer-events:none;text-shadow:0 0 8px currentColor}
@keyframes fly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(.5)}}
.pt-coin{color:#ffd700}
.pt-gem{color:#f0f}
.pt-bolt{color:#ff0}

/* === TAP BUTTON === */
#tpbtn{width:150px;height:150px;flex-shrink:0;border-radius:50%;border:3px solid #0ff;background:radial-gradient(circle at 35% 35%,rgba(0,255,255,.2),#0a0a2a 70%);color:#0ff;font-size:16px;cursor:pointer;box-shadow:0 0 20px rgba(0,255,255,.2),inset 0 0 30px rgba(0,255,255,.05);font-family:inherit;touch-action:manipulation;transition:all .15s;position:relative;overflow:hidden}
#tpbtn::before{content:'';position:absolute;top:-2px;left:-2px;right:-2px;bottom:-2px;border-radius:50%;background:conic-gradient(from 0deg,transparent,#0ff,transparent);animation:rotateBorder 4s linear infinite;opacity:0;transition:opacity .3s}
#tpbtn:hover::before{opacity:1}
#tpbtn::after{content:'';position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(0,255,255,.15),#0a0a2a 70%)}
#tpbtn span{position:relative;z-index:1}
@keyframes rotateBorder{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
#tpbtn:active{transform:scale(.9)!important;box-shadow:0 0 40px rgba(0,255,255,.5),inset 0 0 20px rgba(0,255,255,.1)}
#tpbtn.pressing{animation:tapPulse .15s ease-out}
@keyframes tapPulse{0%{box-shadow:0 0 20px rgba(0,255,255,.2)}50%{box-shadow:0 0 50px rgba(0,255,255,.6)}100%{box-shadow:0 0 20px rgba(0,255,255,.2)}}

#tpinfo{font-size:13px;color:#0f0;margin:8px 0;min-height:18px;text-align:center;text-shadow:0 0 6px rgba(0,255,0,.3)}
#tpinfo.bonus{color:#ffd700;text-shadow:0 0 8px rgba(255,215,0,.5);animation:bonusPop .4s ease-out}
@keyframes bonusPop{0%{transform:scale(1.2)}100%{transform:scale(1)}}
#tcps{font-size:10px;color:#666;text-align:center}

/* === PROGRESS BAR === */
#prog{width:200px;margin:8px auto}
.pb-bg{background:#1a1a2e;border-radius:4px;height:6px;overflow:hidden;position:relative}
.pb-bg::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.1) 50%,transparent 100%);animation:progShine 2s infinite}
@keyframes progShine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.pb-fi{height:100%;background:linear-gradient(90deg,#0ff,#0f0);border-radius:4px;width:0%;transition:.3s;box-shadow:0 0 8px rgba(0,255,255,.3)}
.pb-t{text-align:center;font-size:10px;color:#666;margin-top:3px}

/* === FOOTER === */
footer{display:flex;background:#0d1025;border-top:1px solid rgba(0,255,255,.1);flex-shrink:0;position:relative;overflow-x:auto;-webkit-overflow-scrolling:touch}
footer::before{content:'';position:absolute;top:0;left:10%;width:80%;height:1px;background:linear-gradient(90deg,transparent,rgba(0,255,255,.3),transparent)}
footer .tab{flex:0 0 auto;text-align:center;padding:10px 6px;font-size:10px;cursor:pointer;color:#555;transition:all .2s;position:relative;min-width:52px}
footer .tab:active{transform:scale(.92);background:rgba(0,255,255,.05)}
footer .tab.on{color:#0ff;text-shadow:0 0 5px #0ff}
footer .tab.on::after{content:'';position:absolute;top:0;left:20%;width:60%;height:2px;background:#0ff;box-shadow:0 0 8px #0ff}
footer .tab .tab-icon{display:block;font-size:16px;margin-bottom:2px;transition:transform .2s}
footer .tab:active .tab-icon{transform:scale(1.2)}

/* === PANEL === */
#panel{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,5,16,.95);backdrop-filter:blur(4px);z-index:50;display:none;flex-direction:column;animation:panelIn .2s ease-out}
@keyframes panelIn{0%{opacity:0}100%{opacity:1}}
#ph{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid rgba(0,255,255,.1);background:#0d1025;min-height:40px}
#ph h2{flex:1;font-size:13px;letter-spacing:2px}
#ph button{background:none;border:1px solid rgba(0,255,255,.3);color:#0ff;padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .2s}
#ph button:active{background:rgba(0,255,255,.1);transform:scale(.95)}
#pc{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}

/* === CARDS === */
.card{background:rgba(0,255,255,.05);border:1px solid rgba(0,255,255,.15);border-radius:8px;padding:10px;margin-bottom:6px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,255,255,.05),transparent);transition:left .4s}
.card:active::before{left:100%}
.card:active{transform:scale(.97);background:rgba(0,255,255,.08)}
.card .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.card .nm{color:#0ff;font-weight:bold;font-size:13px}
.card .lv{color:#ffd700;font-size:11px}
.card .d{color:#777;font-size:11px;margin-bottom:3px}
.card .c{color:#ffd700;font-size:12px}
.card.can{border-color:rgba(0,255,255,.4);box-shadow:0 0 8px rgba(0,255,255,.1)}
.card.can:active{box-shadow:0 0 15px rgba(0,255,255,.2)}
.card.done{opacity:.35;cursor:default}

/* === BOSS === */
.boss{background:linear-gradient(135deg,rgba(255,0,68,.08),rgba(255,100,0,.06));border:1px solid rgba(255,0,68,.3);border-radius:8px;padding:10px;margin-bottom:6px;position:relative;overflow:hidden}
.boss::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 50% 50%,rgba(255,0,68,.05),transparent 70%);animation:bossPulse 2s ease-in-out infinite}
@keyframes bossPulse{0%,100%{opacity:.5}50%{opacity:1}}
.boss .bn{color:#f44;font-weight:bold;font-size:13px;margin-bottom:3px;text-shadow:0 0 8px rgba(255,0,68,.5)}
.boss .hp{background:#1a1a2e;border-radius:3px;height:6px;margin:3px 0;overflow:hidden}
.boss .hp-f{height:100%;background:linear-gradient(90deg,#f44,#ff4400);border-radius:3px;transition:.2s;box-shadow:0 0 6px rgba(255,0,68,.4)}
.boss .st{display:flex;justify-content:space-between;font-size:9px;color:#777}
.boss .rw{color:#ffd700;font-size:10px;margin-top:3px}
.atk-btn{width:100%;padding:10px;margin-top:6px;background:linear-gradient(135deg,#f44,#ff4400);border:none;border-radius:4px;color:#fff;font-weight:bold;font-size:13px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.atk-btn::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,.15) 50%,transparent 60%);animation:shimmer 2s infinite}
.atk-btn:active{transform:scale(.95);box-shadow:0 0 20px rgba(255,0,68,.5)}

/* === ACHIEVEMENTS === */
.ach{display:flex;align-items:center;gap:6px;padding:6px;background:rgba(0,255,255,.03);border:1px solid rgba(0,255,255,.08);border-radius:4px;margin-bottom:3px;transition:all .3s}
.ach.done{border-color:#ffd700;background:rgba(255,215,0,.05);box-shadow:0 0 8px rgba(255,215,0,.1)}
.ach.done .ic{animation:achPop .5s ease-out}
@keyframes achPop{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.ach .ic{font-size:18px;min-width:24px;text-align:center}
.ach .inf{flex:1}
.ach .an{font-size:11px;color:#0ff}
.ach .ar{color:#ffd700;font-size:9px}

/* === STATS === */
.strow{display:flex;justify-content:space-between;padding:6px 3px;border-bottom:1px solid rgba(0,255,255,.05);font-size:11px;transition:background .2s}
.strow:active{background:rgba(0,255,255,.03)}
.strow .sl{color:#777}
.strow .sv{color:#0ff;font-weight:bold}

.danger{background:rgba(255,0,68,.1);border:1px solid rgba(255,0,68,.3);color:#f44;padding:6px;border-radius:4px;font-size:11px;cursor:pointer;margin-top:6px;width:100%;transition:all .2s}
.danger:active{background:rgba(255,0,68,.2);transform:scale(.97)}

/* === CHAT === */
#chat-scr{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,5,16,.97);backdrop-filter:blur(6px);z-index:100;display:none;flex-direction:column;animation:chatIn .25s ease-out}
@keyframes chatIn{0%{opacity:0;transform:scale(.98)}100%{opacity:1;transform:scale(1)}}
#chtabs{display:flex;border-bottom:1px solid rgba(0,255,255,.1);flex-shrink:0}
.chtab{flex:1;text-align:center;padding:8px;font-size:11px;cursor:pointer;color:#666;border-bottom:2px solid transparent;transition:all .2s}
.chtab:active{background:rgba(0,255,255,.05)}
.chtab.on{color:#0ff;border-color:#0ff;text-shadow:0 0 5px #0ff}
#chmsgs{flex:1;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}
.chmsg{margin-bottom:6px;padding:8px;background:rgba(0,255,255,.03);border-radius:6px;border-left:2px solid #0ff;animation:msgIn .3s ease-out;transition:all .2s}
@keyframes msgIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
.chmsg .auth{color:#ffd700;font-weight:bold;font-size:10px}
.chmsg .txt{color:#ccc;font-size:12px;margin-top:2px;word-break:break-word;white-space:pre-wrap}
.chmsg .time{color:#555;font-size:9px;margin-top:2px;text-align:right}
.chmsg.me{border-left-color:#ffd700;background:rgba(255,215,0,.05)}
.chmsg.owl{border-left-color:#a0f;background:rgba(170,0,255,.05)}
.chmsg.owl .auth{color:#a0f;text-shadow:0 0 4px rgba(170,0,255,.5)}
#chowli{font-size:10px;color:rgba(170,0,255,.7);text-align:center;padding:4px;display:none;background:rgba(170,0,255,.05);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
#chinp{display:flex;padding:8px;border-top:1px solid rgba(0,255,255,.1);gap:6px;flex-shrink:0}
#chinp input{flex:1;padding:10px;background:rgba(0,255,255,.05);border:1px solid rgba(0,255,255,.2);border-radius:4px;color:#0ff;font-size:13px;outline:none;transition:all .2s}
#chinp input:focus{border-color:#0ff;box-shadow:0 0 8px rgba(0,255,255,.15)}
#chinp button{padding:10px 14px;background:linear-gradient(135deg,#0ff,#4af);border:none;border-radius:4px;color:#000;font-weight:bold;font-size:12px;cursor:pointer;transition:all .2s}
#chinp button:active{transform:scale(.93)}

/* === BOSS FIGHT === */
#bfight{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,5,16,.95);backdrop-filter:blur(4px);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;animation:bfadeIn .3s ease-out}
@keyframes bfadeIn{0%{opacity:0}100%{opacity:1}}
#bfs{font-size:64px;animation:bounce 1s ease-in-out infinite;filter:drop-shadow(0 0 15px rgba(255,0,68,.5))}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.05)}}
#bfn{color:#f44;font-size:18px;font-weight:bold;text-shadow:0 0 12px #f44;margin:10px 0;animation:bossNameGlow 1.5s ease-in-out infinite alternate}
@keyframes bossNameGlow{0%{text-shadow:0 0 12px #f44}100%{text-shadow:0 0 20px #f44,0 0 30px rgba(255,0,68,.3)}}
.fdmg{position:absolute;font-size:20px;font-weight:bold;color:#f44;animation:fdmg .8s ease-out forwards;pointer-events:none;z-index:201;text-shadow:0 0 8px #f44}
@keyframes fdmg{0%{opacity:1;transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.2)}100%{opacity:0;transform:translateY(-60px) scale(.8)}}

/* === OVERLAY === */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:150;padding:20px}
.overlay.show{display:flex}
.overlay-box{background:#0d1025;border:1px solid #0ff;border-radius:12px;padding:15px;max-width:320px;width:100%;text-align:center;animation:overlayIn .3s ease-out;box-shadow:0 0 30px rgba(0,255,255,.1)}
@keyframes overlayIn{0%{opacity:0;transform:scale(.9) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.overlay-box h3{color:#0ff;font-size:14px;margin-bottom:8px;text-shadow:0 0 6px rgba(0,255,255,.3)}
.overlay-box p{color:#888;font-size:12px;margin-bottom:15px;line-height:1.5}
.overlay-box button{background:linear-gradient(135deg,#0ff,#4af);border:none;color:#000;padding:6px 15px;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer;margin:3px;transition:all .2s}
.overlay-box button:active{transform:scale(.93)}
.overlay-box button.cancel{background:transparent;border:1px solid rgba(255,0,68,.3);color:#f44}

/* === ACHIEVEMENT POPUP === */
#ach-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:linear-gradient(135deg,#0d1025,#1a1a3e);border:2px solid #ffd700;border-radius:12px;padding:15px 20px;text-align:center;z-index:300;transition:all .4s cubic-bezier(.68,-.55,.27,1.55);box-shadow:0 0 40px rgba(255,215,0,.3);pointer-events:none;opacity:0}
#ach-popup.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
#ach-popup .ach-icon{font-size:32px;margin-bottom:5px}
#ach-popup .ach-title{color:#ffd700;font-size:14px;font-weight:bold;text-shadow:0 0 8px rgba(255,215,0,.5)}
#ach-popup .ach-desc{color:#888;font-size:11px;margin-top:3px}

/* === COMBO DISPLAY === */
#combo-display{position:absolute;top:10%;left:50%;transform:translateX(-50%);font-size:24px;font-weight:bold;color:#ffd700;text-shadow:0 0 15px rgba(255,215,0,.6);pointer-events:none;z-index:15;opacity:0;transition:all .3s}
#combo-display.show{opacity:1;animation:comboShake .3s ease-out}
@keyframes comboShake{0%{transform:translateX(-50%) scale(1.3)}100%{transform:translateX(-50%) scale(1)}}

/* === LEADERBOARD === */
#lb-tabs{display:flex;border-bottom:1px solid rgba(0,255,255,.1);margin-bottom:8px}
.lb-tab{flex:1;text-align:center;padding:6px;font-size:10px;cursor:pointer;color:#555;border-bottom:2px solid transparent;transition:all .2s}
.lb-tab.on{color:#ffd700;border-color:#ffd700;text-shadow:0 0 5px rgba(255,215,0,.3)}
.lb-row{display:flex;align-items:center;padding:6px 4px;border-bottom:1px solid rgba(0,255,255,.05);font-size:11px;transition:background .2s}
.lb-row:active{background:rgba(0,255,255,.03)}
.lb-row.me{background:rgba(255,215,0,.05);border-left:2px solid #ffd700}

function checkDailyReward(){
  var now=Math.floor(Date.now()/86400000);
  var last=S.lastDaily||0;
  var streak=S.dailyStreak||0;
  if(now>last){
    if(now===last+1){streak++}else{streak=1};
    S.lastDaily=now;S.dailyStreak=streak;
    var rewards=[{day:1,credits:100,gems:5},{day:2,credits:250,gems:10},{day:3,credits:500,gems:20},{day:4,credits:1000,gems:35},{day:5,credits:2000,gems:50},{day:6,credits:5000,gems:75},{day:7,credits:10000,gems:100}];
    var reward=rewards[Math.min(streak-1,rewards.length-1)];
    S.c+=reward.credits;S.g+=reward.gems;S.ct+=reward.credits;
    setTimeout(function(){dlg("🎁 Ежедневная награда!","День "+streak+" подряд!\n\n+"+fmt(reward.credits)+" 💎\n+"+reward.gems+" 💎 гемов",[{t:"Отлично!",f:function(){hdlg()}}])},500);
  }
}

  try{

    x.setRequestHeader("Content-Type","application/json");

    x.send(JSON.stringify({chat_id:TG_CHAT_ID,text:text,parse_mode:"HTML"}));
  }catch(e){}
}

  addChatMsg("🦉 OWL",msg);
  tgNotify(msg);
}

function dbReq(path,method,data,cb){
  try{
    var x=new XMLHttpRequest();
    x.open(method||"GET",DB_URL+path,true);
    x.setRequestHeader("Content-Type","application/json");
    x.timeout=5000;
    x.onreadystatechange=function(){if(x.readyState===4&&cb)cb(x.status,x.responseText)};
    x.onerror=function(){if(cb)cb(0,"")};
    x.ontimeout=function(){if(cb)cb(0,"")};
    x.send(data?JSON.stringify(data):null);
  }catch(e){if(cb)cb(0,"")}
}

function dbRegister(username,password){
  dbReq("/register","POST",{username:username,password:password},function(s,t){
    if(s===200){try{var d=JSON.parse(t);if(d.ok)dbLogin(username,password)}catch(e){}}
  });
}

function dbLogin(username,password){
  dbReq("/login","POST",{username:username,password:password},function(s,t){
    if(s===200){try{var d=JSON.parse(t);if(d.ok){dbUserId=d.user_id;dbStartSync()}}catch(e){}}
  });
}

function dbSave(){
  if(!dbUserId)return;
  dbReq("/save","POST",{user_id:dbUserId,stats:{

}

function dbChat(message,isDev){
  if(!curUser)return;
  dbReq("/chat","POST",{username:curUser,message:message,is_dev_chat:isDev||false});
}

function dbStartSync(){
  if(dbSyncTimer)clearInterval(dbSyncTimer);
  dbSyncTimer=setInterval(dbSave,30000);
}

// === TAP WITH EFFECTS ===
function tap(){
  var now=Date.now();
  if(now-S.lastTapTime<500){S.combo++;if(S.combo>S.comboMax)S.comboMax=S.combo}else{S.combo=1};
  S.lastTapTime=now;
  var comboBonus=1+Math.floor(S.combo/5)*0.5;
  var v=Math.floor(S.cp*S.gm*comboBonus*S.luck);
  S.c+=v;S.ct+=v;S.cl++;S.rp+=v;

  // Combo display
  if(S.combo>=5){
    var cd=id("combo-display");
    cd.textContent="⚡ COMBO x"+S.combo+"!";
    cd.className="show";
    setTimeout(function(){cd.className=""},1500);
  }

  var comboText=S.combo>1?" x"+comboBonus+" ⚡":"";
  id("tpinfo").textContent="+"+fmt(v)+comboText;
  id("tpinfo").className=comboBonus>1?"bonus":"";

  // Button animation
  var btn=id("tpbtn");
  btn.className="pressing";
  setTimeout(function(){btn.className=""},150);

  // Sound
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = 800 + Math.random()*400;
    gain.gain.value = 0.1;
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  }catch(e){}

  // Particles
  if(id("panel").style.display==="none"){
    var colors=["#0ff","#ffd700","#f0f","#0f0"];
    var symbols=["+","✦","◆","●"];
    for(var i=0;i<4;i++){
      var part=document.createElement("div");
      var isCoin=Math.random()<0.3;
      var isGem=Math.random()<0.1;
      part.className="pt "+(isCoin?"pt-coin":isGem?"pt-gem":"");
      part.textContent=isCoin?"💎":isGem?"✨":symbols[Math.floor(Math.random()*symbols.length)];
      part.style.cssText="position:absolute;pointer-events:none;z-index:100;font-size:"+(12+Math.random()*8)+"px;color:"+(isCoin?"#ffd700":isGem?"#f0f":colors[Math.floor(Math.random()*colors.length)])+";left:"+(40+Math.random()*20)+"%;top:"+(40+Math.random()*20)+"%;transition:all .6s ease-out;";
      id("tapz").appendChild(part);
      (function(p){setTimeout(function(){p.style.opacity="0";p.style.transform="translateY(-"+(60+Math.random()*40)+"px) scale(0) rotate("+(Math.random()*360)+"deg)"},50);setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p)},700)})(part);
    }
  }

  // Boss fight
  if(S.cb&&S.bh>0){S.bh-=v;if(S.bh<=0)winBoss()}

  // Level up
  while(S.rp>=S.rg){S.rp-=S.rg;S.rl++;S.rg=Math.floor(S.rg*1.4);S.cp+=Math.ceil(S.rl*0.5);S.ps+=S.rl*0.3}

  // Random boss spawn (rare: ~0.5% base, scales with realm level)
  if(!S.cb&&S.rl>=5&&Math.random()<0.005+Math.min(S.rl*0.001,0.015)){
    var r=Math.min(Math.floor(S.rl/5),BS.length-1);
    if(Math.random()<0.02){
      var rare=BS.filter(function(b){return b.rare});
      if(rare.length>0){var rb=rare[Math.floor(Math.random()*rare.length)];S.cb=rb;S.bh=rb.hp;showBossFight(rb,true);chkAch();draw();return}
    }
    S.cb=BS[r];S.bh=S.cb.hp;showBossFight(S.cb,false);
  }
  chkAch();chkQuests();draw()
}

function showBossFight(boss,isRare){
  id("bfight").style.display="flex";

}

function spawnBoss(){
  var i=Math.min(Math.floor(S.rl/5),BS.length-1);
  if(Math.random()<0.05+S.luck*0.02){
    var rare=BS.filter(function(b){return b.rare});
    if(rare.length>0){var rb=rare[Math.floor(Math.random()*rare.length)];S.cb=rb;S.bh=rb.hp;showBossFight(rb,true);return}
  }
  S.cb=BS[i];S.bh=S.cb.hp;showBossFight(S.cb,false)
}

function winBoss(){
  var r=Math.floor(S.cb.cr*S.gm*(1+(S.gemBonus||0)));

  flyText("+ "+fmt(r));
  S.cb=null;S.bh=0;id("bfight").style.display="none";
  chkAch();draw()
}

function updateBossHP(){
  var pct=Math.max(0,(S.bh/S.cb.hp)*100);

  id("bf-text").textContent="HP: "+fmt(S.bh)+" / "+fmt(S.cb.hp)
}

var lbTab="credits",lbData=[],lbSyncing=false;
var LB_KEY="cr_lb_global";

function getMyScore(){
  return {name:curUser||"?",credits:S.ct,level:S.rl,bosses:S.bs,prestige:S.pr,achievements:S.ac.length,cps:getCPS(),combo:S.comboMax,timestamp:Date.now()}
}

function loadLeaderboard(){
  try{var d=localStorage.getItem(LB_KEY);if(d)lbData=JSON.parse(d)}catch(e){}
  if(!Array.isArray(lbData))lbData=[];
}

function saveLeaderboard(){
  localStorage.setItem(LB_KEY,JSON.stringify(lbData.slice(0,100)));
}

function publishScore(){
  if(!curUser)return;
  loadLeaderboard();
  var my=getMyScore();
  var found=false;
  for(var i=0;i<lbData.length;i++){
    if(lbData[i].name===curUser){lbData[i]=my;found=true;break}
  }
  if(!found)lbData.push(my);
  saveLeaderboard();
}

function syncLeaderboard(syncBtn){
  if(lbSyncing)return;
  lbSyncing=true;
  if(syncBtn)syncBtn.textContent="🔄 Синхронизация...";
  // Read leaderboard from GitHub Pages JSON file (CORS-friendly, same origin)
  var url="https://tommleebusiness.github.io/cyber-realm-game/leaderboard.json";
  try{
    fetch(url,{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
    .then(function(data){
      loadLeaderboard();
      var remoteScores=data.players||[];
      // Merge: keep highest score per player
      var merged={};
      for(var i=0;i<lbData.length;i++){merged[lbData[i].name]=lbData[i]}
      for(var i=0;i<remoteScores.length;i++){var r=remoteScores[i];if(!merged[r.name]||r.credits>merged[r.name].credits)merged[r.name]=r}
      lbData=Object.values(merged);
      saveLeaderboard();
      if(syncBtn)syncBtn.textContent="✅ Обновлено!";
      setTimeout(function(){if(syncBtn)syncBtn.textContent="🔄 Обновить"},2000);
      lbSyncing=false;
      renderLeaderboard(lbTab);
    })
    .catch(function(e){
      if(syncBtn)syncBtn.textContent="⚠️ Оффлайн (локально)";
      setTimeout(function(){if(syncBtn)syncBtn.textContent="🔄 Обновить"},2000);
      lbSyncing=false;
      renderLeaderboard(lbTab);
    });
  }catch(e){
    if(syncBtn)syncBtn.textContent="⚠️ Оффлайн";
    lbSyncing=false;
  }
}

function parseVal(s){
  s=(s||"").toUpperCase().replace(/,/g,"");
  if(s.indexOf("T")>=0)return parseFloat(s)*1e12;
  if(s.indexOf("B")>=0)return parseFloat(s)*1e9;
  if(s.indexOf("M")>=0)return parseFloat(s)*1e6;
  if(s.indexOf("K")>=0)return parseFloat(s)*1e3;
  return parseFloat(s)||0;
}

function doPrestige(){
  var pts=Math.floor(Math.sqrt(S.ct/1e6)+S.rl*0.5);
  if(pts<1){hdlg();return}
  S.pr++;S.pp+=pts;S.c=0;S.ct=0;S.n=0;S.d=0;S.e=0;S.cl=0;
  S.cp=1+S.pp*0.1;S.ps=0;S.gm=1;S.dm=1;S.ns=0;S.ds=0;S.es=0;
  S.rl=1;S.rp=0;S.rg=100;S.up={};S.cb=null;S.bh=0;
  var milestones=[{pr:1,bonus:"x1.1 к тапу",fn:function(){S.cp*=1.1}},{pr:3,bonus:"x1.2 к доходу",fn:function(){S.gm*=1.2}},{pr:5,bonus:"+10% гемов",fn:function(){S.gemBonus=(S.gemBonus||0)+0.1}},{pr:10,bonus:"x1.5 ко всему",fn:function(){S.gm*=1.5}},{pr:25,bonus:"x2 ко всему",fn:function(){S.gm*=2}}];
  var unlocked=[];
  for(var i=0;i<milestones.length;i++){if(S.pr>=milestones[i].pr&&!S["ms"+milestones[i].pr]){S["ms"+milestones[i].pr]=true;milestones[i].fn();unlocked.push(milestones[i].bonus)}}
  var msg="Престиж завершён! Очки: "+pts;
  if(unlocked.length>0)msg+="\n\n🏆 Разблокировки:\n"+unlocked.join("\n");
  hdlg();id("panel").style.display="none";
  setTimeout(function(){dlg("🌟 Престиж "+S.pr,msg,[{t:"Отлично!",f:function(){hdlg()}}])},300);
  saveGame();draw()
}
